# Builds the GRID0+ Toolbox .nro. Only runs when toolbox/ (or this
# workflow) changes, the sysmodule builds separately. Every push to `main`
# that bumps APP_VERSION also cuts a GitHub release automatically, no manual
# tag push needed. Re-running the workflow against a version that already has
# a release (e.g. a docs-only push) is a no-op for the release step.
name: Build toolbox

on:
  push:
    branches: [main]
    paths: ['toolbox/**', '.github/workflows/toolbox.yml']
  pull_request:
    branches: [main]
    paths: ['toolbox/**', '.github/workflows/toolbox.yml']
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    defaults:
      run:
        working-directory: toolbox
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_name: ${{ steps.version.outputs.release_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          APP_VERSION=$(sed -n 's/^APP_VERSION := *//p' Makefile)
          MAJOR=$(echo "${APP_VERSION}" | cut -d. -f1)
          MINOR=$(echo "${APP_VERSION}" | cut -d. -f2)
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          # Beta phase (major version 0): release title tracks major.minor,
          # e.g. 0.1.0 -> "beta-0.1". Update this once the project leaves 0.x.
          echo "release_name=beta-${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION from Makefile: ${APP_VERSION}"

      - name: Check version alignment
        run: |
          APP_VERSION=$(sed -n 's/^APP_VERSION := *//p' Makefile)
          MAJOR=$(sed -n 's/^#define SWITCHNET_VERSION_MAJOR *//p' source/version.h)
          MINOR=$(sed -n 's/^#define SWITCHNET_VERSION_MINOR *//p' source/version.h)
          PATCH=$(sed -n 's/^#define SWITCHNET_VERSION_PATCH *//p' source/version.h)
          FALLBACK="${MAJOR}.${MINOR}.${PATCH}"
          echo "Makefile APP_VERSION      = ${APP_VERSION}"
          echo "version.h semver fallback = ${FALLBACK}"
          if [ "${APP_VERSION}" != "${FALLBACK}" ]; then
            echo "::error::Version mismatch between Makefile and source/version.h"
            exit 1
          fi

      - name: Build
        run: make -j"$(nproc)"

      - name: Prepare versioned artifact
        run: |
          ls -l *.nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchNet-Toolbox-v${{ steps.version.outputs.app_version }}
          path: toolbox/switchnet.nro
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check whether this version was already released
        id: tagcheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.build.outputs.app_version }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/${TAG}")
          if [ "${STATUS}" = "200" ]; then
            echo "::notice::${TAG} already has a release; skipping (bump APP_VERSION to release again)."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download NRO artifact
        if: steps.tagcheck.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: SwitchNet-Toolbox-v${{ needs.build.outputs.app_version }}

      - name: Create release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.app_version }}
          name: ${{ needs.build.outputs.release_name }}
          files: switchnet.nro
          generate_release_notes: true
