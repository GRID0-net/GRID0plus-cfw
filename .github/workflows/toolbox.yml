# Builds the GRID0+ Toolbox .nro on its own, as a quick check when toolbox/
# changes. Releases are cut by build.yml only, which attaches both the united
# SD zip and grid0plus-toolbox.nro to one release: two workflows releasing
# the same tag raced, and the loser's file never reached the release.
name: Build toolbox

on:
  push:
    branches: [main]
    paths: ['toolbox/**', '.github/workflows/toolbox.yml']
  pull_request:
    branches: [main]
    paths: ['toolbox/**', '.github/workflows/toolbox.yml']
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    defaults:
      run:
        working-directory: toolbox
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_name: ${{ steps.version.outputs.release_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          APP_VERSION=$(sed -n 's/^APP_VERSION := *//p' Makefile)
          MAJOR=$(echo "${APP_VERSION}" | cut -d. -f1)
          MINOR=$(echo "${APP_VERSION}" | cut -d. -f2)
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          # Beta phase (major version 0): release title tracks major.minor,
          # e.g. 0.1.0 -> "beta-0.1". Update this once the project leaves 0.x.
          echo "release_name=beta-${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION from Makefile: ${APP_VERSION}"

      - name: Check version alignment
        run: |
          APP_VERSION=$(sed -n 's/^APP_VERSION := *//p' Makefile)
          MAJOR=$(sed -n 's/^#define GRID0PLUS_VERSION_MAJOR *//p' source/version.h)
          MINOR=$(sed -n 's/^#define GRID0PLUS_VERSION_MINOR *//p' source/version.h)
          PATCH=$(sed -n 's/^#define GRID0PLUS_VERSION_PATCH *//p' source/version.h)
          FALLBACK="${MAJOR}.${MINOR}.${PATCH}"
          echo "Makefile APP_VERSION      = ${APP_VERSION}"
          echo "version.h semver fallback = ${FALLBACK}"
          if [ "${APP_VERSION}" != "${FALLBACK}" ]; then
            echo "::error::Version mismatch between Makefile and source/version.h"
            exit 1
          fi

      - name: Build
        run: make -j"$(nproc)"

      - name: Prepare versioned artifact
        run: |
          ls -l *.nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: grid0plus-toolbox-v${{ steps.version.outputs.app_version }}
          path: toolbox/grid0plus-toolbox.nro
          if-no-files-found: error

