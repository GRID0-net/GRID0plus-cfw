# Builds the SwitchNet Toolbox .nro on every push/PR, and attaches it to the
# release when a v* tag is pushed.
name: Build NRO

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          APP_VERSION=$(sed -n 's/^APP_VERSION := *//p' Makefile)
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION from Makefile: ${APP_VERSION}"

      - name: Check version alignment
        run: |
          APP_VERSION=$(sed -n 's/^APP_VERSION := *//p' Makefile)
          MAJOR=$(sed -n 's/^#define SWITCHNET_VERSION_MAJOR *//p' source/version.h)
          MINOR=$(sed -n 's/^#define SWITCHNET_VERSION_MINOR *//p' source/version.h)
          PATCH=$(sed -n 's/^#define SWITCHNET_VERSION_PATCH *//p' source/version.h)
          FALLBACK="${MAJOR}.${MINOR}.${PATCH}"
          echo "Makefile APP_VERSION      = ${APP_VERSION}"
          echo "version.h semver fallback = ${FALLBACK}"
          if [ "${APP_VERSION}" != "${FALLBACK}" ]; then
            echo "::error::Version mismatch between Makefile and source/version.h"
            exit 1
          fi

      - name: Check tag matches version
        if: github.ref_type == 'tag'
        run: |
          APP_VERSION=$(sed -n 's/^APP_VERSION := *//p' Makefile)
          if [ "v${APP_VERSION}" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match APP_VERSION v${APP_VERSION}"
            exit 1
          fi

      - name: Build
        run: make -j"$(nproc)"

      - name: Prepare versioned artifact
        run: |
          cp -f switchnet.nro "SwitchNet-Toolbox-v${{ steps.version.outputs.app_version }}.nro"
          ls -l *.nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchNet-Toolbox-v${{ steps.version.outputs.app_version }}
          path: SwitchNet-Toolbox-v${{ steps.version.outputs.app_version }}.nro
          if-no-files-found: error

      - name: Upload NRO to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: SwitchNet-Toolbox-v${{ steps.version.outputs.app_version }}.nro
          generate_release_notes: true
