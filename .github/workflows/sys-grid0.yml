# Builds the sys-GRID0 sysmodule + overlay bundle. Only runs when
# sys-grid0/ (or this workflow) changes, the toolbox builds separately.
name: Build sysmodule

on:
  push:
    branches: [main]
    paths: ['sys-grid0/**', '.gitmodules', '.github/workflows/sys-grid0.yml']
  pull_request:
    branches: [main]
    paths: ['sys-grid0/**', '.gitmodules', '.github/workflows/sys-grid0.yml']
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Switch portlibs
        run: dkp-pacman -S --noconfirm --needed switch-curl switch-zlib switch-mbedtls

      - name: Make sure bsdtar exists
        run: command -v bsdtar || dkp-pacman -S --noconfirm --needed libarchive

      - name: Build ZeroTier core
        run: make -C sys-grid0 zt-core -j"$(nproc)"

      - name: Build sysmodule bundle
        run: make -C sys-grid0 bundle -j"$(nproc)"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: sys-grid0-bundle
          path: sys-grid0/dist/sys-zerotier.zip
          if-no-files-found: error
